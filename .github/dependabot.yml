# Opens pull requests for dependency updates and security fixes, so the
# lockfiles stop drifting between hand-run upgrades.
version: 2

updates:
  # One entry per npm project: each owns its package-lock.json. The build-free
  # pages have no package.json and nothing for Dependabot to read. A new npm
  # project needs its directory added here; CI finds it on its own.
  - package-ecosystem: "npm"
    directories:
      - "/bmi"
      - "/lemon/react-js"
      - "/portfolio"
      - "/tic-tac-toe-js"
      - "/weather"
    schedule:
      interval: "weekly"
    groups:
      # Packages that only install as a family move together, majors included,
      # so a new major arrives as one pull request npm ci accepts rather than
      # one package that its peers reject. Dependabot puts a dependency in the
      # first group it matches, so these sit above `routine`.
      react:
        # framer-motion 7 accepts only React 18, and @testing-library/react
        # 13 only react-dom 18: neither can stay behind on React 19.
        patterns: ["react", "react-dom", "@testing-library/react", "framer-motion"]
      fontawesome:
        # react-fontawesome 0.2 accepts fontawesome-svg-core up to 6, and the
        # icon packages track svg-core's major.
        patterns: ["@fortawesome/*"]
      # Minor and patch bumps travel together, one pull request per project.
      # Majors stay on their own, because those are the ones worth reading.
      routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # The workflow pins actions by moving major tag; this proposes new majors.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
